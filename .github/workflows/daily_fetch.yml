name: Daily fetch

on:
  schedule:
    - cron: "15 21 * * 1-5"   # 21:15 UTC, Mo-Fr (22:15 MEZ / 23:15 MESZ)
  workflow_dispatch:           # manuell startbar im Reiter "Actions"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/daily_fetch.py
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
